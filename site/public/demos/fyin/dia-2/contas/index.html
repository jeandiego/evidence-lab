<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fyin · Contas · Jornada</title>
<link href="../vendor/urbanist.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/phosphor-regular.css">
<link rel="stylesheet" href="../vendor/phosphor-fill.css">
<link rel="stylesheet" href="../vendor/phosphor-bold.css">
<!-- Mesmo motor e mesmos tokens do protótipo de Transações (quadro 20) -->
<link rel="stylesheet" href="../transacoes/style.css">
<link rel="stylesheet" href="contas.css">
<link rel="stylesheet" href="../presentation.css">
</head>
<body>
<div class="stage">
<div class="phone" id="phone">
  <div class="scroller" id="scroller">
    <div class="topbar" id="topbar">
      <div class="statusbar" aria-hidden="true">
        <span class="sb-time">9:41</span>
        <span class="sb-ind">
          <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="6" width="3" height="6" rx="1"/><rect x="9" y="3" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.1A10 10 0 0 0 8 .6 10 10 0 0 0 .9 3.5L2 4.6a8.4 8.4 0 0 1 6-2.4Zm0 3.2c1.4 0 2.7.5 3.7 1.4l1.1-1.1A6.8 6.8 0 0 0 8 3.8a6.8 6.8 0 0 0-4.8 1.9l1.1 1.1c1-.9 2.3-1.4 3.7-1.4Zm0 3.2c.6 0 1.1.2 1.5.6L8 10.7 6.5 9.2c.4-.4.9-.6 1.5-.6Z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".5"/></svg>
        </span>
      </div>
      <div class="nav">
        <button class="ib" aria-label="Voltar para o Início"><i class="ph ph-arrow-left"></i></button>
        <div class="nav-title" id="navTitle" aria-hidden="true">Contas</div>
        <button class="ptrig" aria-label="Período: novembro"><span class="pv">Novembro</span><i class="ph ph-caret-down"></i></button>
      </div>
    </div>
    <h1 class="bigtitle">Contas</h1>
    <div id="sumry" class="sumry" aria-live="polite"></div>
    <div class="scope" id="scope">
      <div class="segwrap"><div class="seg" id="segTabs" role="radiogroup" aria-label="Contas a pagar ou pagas"><span class="sthumb"></span>
        <button role="radio" data-tab="open" aria-checked="true">A pagar</button><button role="radio" data-tab="paid" aria-checked="false">Pagas</button></div></div>
      <div class="ctx" id="ctx" hidden></div>
    </div>
    <div class="list" id="list"></div>
    <div class="listfoot" id="listfoot"></div>
  </div>

  <div class="bottomfade" aria-hidden="true"></div>
  <div class="scrim" id="scrim"></div>
  <div class="dockbar" id="dock" role="toolbar" aria-label="Buscar, filtrar e adicionar">
    <label class="well"><i class="ph ph-magnifying-glass"></i>
      <input id="q" type="text" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="Buscar" aria-label="Buscar contas">
      <button class="qclear" data-act="q-clear" aria-label="Limpar busca" hidden><i class="ph-fill ph-x-circle"></i></button></label>
    <button class="dbtn" data-act="filters" aria-label="Filtros"><i class="ph ph-sliders-horizontal"></i><span class="badge" hidden></span></button>
    <button class="dbtn" data-act="add" aria-label="Adicionar conta"><i class="ph ph-plus"></i></button>
  </div>
  <div class="surface" id="modal" role="dialog" aria-modal="true" aria-label="Conta" style="display:none"></div>
  <div class="flight" id="flight"></div>
  <div class="toasts" id="toasts"></div>
  <div class="homeind" id="homeind"></div>
</div>

<aside class="sim" aria-label="Simular eventos">
  <h2>Simular</h2>
  <p>O que o servidor, o banco ou outra pessoa fariam. Use para ver B4, D, E e F.</p>
  <label class="simt"><input type="checkbox" id="simFail"> Próxima gravação falha <small>B4 · volta ao lugar + Tentar de novo</small></label>
  <label class="simt"><input type="checkbox" id="simOffline"> Sem conexão <small>F2 · fica na fila deste iPhone</small></label>
  <button data-sim="statement">Extrato chega <small>D2 · confere o que dá; ambíguo vira Revisar</small></button>
  <button data-sim="marina">Marina paga Condomínio <small>F3 · casa compartilhada, toast de topo</small></button>
  <button data-sim="remote">Marina já pagou Internet no iPhone dela <small>F4 · toque o anel ou Marcar depois</small></button>
  <button data-sim="allpaid">Pagar tudo <small>A3 · nada a pagar</small></button>
  <button data-sim="loadfail">Falha ao carregar <small>F1 · erro recuperável</small></button>
  <button data-sim="empty">Sem contas <small>A5 · primeiro uso</small></button>
  <button data-sim="reset">Recomeçar</button>
  <div class="simlog" id="simlog" aria-live="polite"></div>
  <p class="foot"><b>?slow=4</b> desacelera as molas</p>
</aside>
</div>
<script src="data.js"></script>
<script src="../transacoes/engine.js"></script>
<script src="app.js"></script>
<script src="../presentation.js"></script>
</body>
</html>
