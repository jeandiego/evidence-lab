<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>005 motion</title>
<style>
  :root {
    --bg: #0a0b0d; --panel: #121418; --line: #24272d; --ink: #f2f3ee; --muted: #8b9098;
    --lime: #c8ff3d; --lime-dim: #c8ff3d33; --red: #ff5a47; --red-dim: #ff5a4733;
    --sans: -apple-system, "SF Pro Display", system-ui, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1350px; overflow: hidden; font-family: var(--sans); color: var(--ink);
    background: radial-gradient(120% 70% at 50% 38%, #1a1d22 0%, #0d0e11 55%, #08090b 100%); }
  #grid { position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px);
    background-size: 54px 54px; mask-image: radial-gradient(70% 60% at 50% 45%, #000 20%, transparent 85%); }
  #view { position: absolute; inset: 0; }
  #world { position: absolute; left: 0; top: 0; width: 1280px; height: 960px; transform-origin: 0 0; will-change: transform, filter; }
  #screen { position: absolute; left: 0; top: -40px; width: 1280px; height: 1000px; border-radius: 18px; overflow: hidden;
    background: #f3f0e9; box-shadow: 0 50px 140px #000c, 0 0 0 1px #ffffff1a; }
  .bar { height: 40px; background: #1c1e22; display: flex; align-items: center; padding: 0 16px; gap: 8px; border-bottom: 1px solid #000; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #3a3d43; }
  .bar .url { margin: 0 auto; transform: translateX(-30px); padding: 5px 18px; border-radius: 8px; background: #2a2d32; color: #c9ccd2; font: 500 14px var(--mono); }
  #foot { position: absolute; left: 0; top: 0; width: 1280px; height: 960px; }
  #wsvg { position: absolute; left: 0; top: 0; width: 1280px; height: 960px; overflow: visible; }
  #diag { position: absolute; inset: 0; width: 1080px; height: 1350px; overflow: visible; }
  #caps { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; pointer-events: none; }
  #scrim { position: absolute; left: 0; top: 0; width: 1080px; height: 330px; background: linear-gradient(#08090bf2 0%, #08090bcc 55%, #08090b00 100%); }
  .cap { position: absolute; left: 64px; right: 64px; }
  .kick { font: 600 19px var(--mono); letter-spacing: .14em; color: var(--lime); margin-bottom: 16px; text-transform: uppercase; }
  .line { font-weight: 760; font-size: 70px; line-height: 1.02; letter-spacing: -.038em; white-space: nowrap; }
  .w { display: inline-block; margin-right: .22em; }
  .lime { color: var(--lime); } .red { color: var(--red); } .dim { color: #9aa0a8; }
  #code { position: absolute; left: 64px; width: 952px; border-radius: 18px; background: #0f1114f0; border: 1px solid #2a2e35;
    box-shadow: 0 30px 80px #000a, 0 0 0 1px #c8ff3d22; padding: 26px 30px; font: 500 23px/1.55 var(--mono); color: #d9dce1; white-space: pre; transform-origin: 50% 50%; }
  #code .file { font-size: 15px; color: var(--muted); letter-spacing: .06em; margin-bottom: 12px; }
  #code .k { color: #ff7ab8; } #code .f { color: var(--lime); } #code .p { color: #8fd3ff; } #code .c { color: #6c7380; }
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 70px; }
  #end .big { font-weight: 820; font-size: 132px; line-height: .95; letter-spacing: -.05em; }
  #end .sub { font-weight: 780; font-size: 74px; line-height: 1; letter-spacing: -.04em; color: var(--lime); margin-top: 18px; }
  #end .meta { margin-top: 54px; font: 500 20px/1.7 var(--mono); color: var(--muted); letter-spacing: .02em; }
  #end .ch { display: inline-block; }
  #cmp { position: absolute; left: 64px; right: 64px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { border-radius: 18px; padding: 24px 26px; background: #111317f2; border: 1px solid #2a2e35; }
  .card h4 { font: 600 15px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .card .n { font-weight: 800; font-size: 96px; letter-spacing: -.05em; line-height: 1; margin: 12px 0 2px; }
  .card .u { font: 500 18px var(--mono); color: #c9ccd2; }
  .card .o { margin-top: 14px; font-weight: 650; font-size: 25px; letter-spacing: -.01em; }
  .card .r { margin-top: 8px; font: 500 15px var(--mono); color: var(--muted); }
  .card.bad { border-color: #ff5a4740; } .card.bad .n, .card.bad .o { color: var(--red); }
  .card.good { border-color: #c8ff3d66; box-shadow: 0 0 60px #c8ff3d1f; } .card.good .n, .card.good .o { color: var(--lime); }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #flash { position: absolute; inset: 0; background: radial-gradient(60% 50% at 50% 50%, #effcd0, #c8ff3d 60%, #8bbf1a); mix-blend-mode: screen; opacity: 0; }
  #vig { position: absolute; inset: 0; background: radial-gradient(85% 75% at 50% 48%, transparent 55%, #000a 100%); }
  #grain { position: absolute; inset: -64px; opacity: .07; mix-blend-mode: overlay; }
  #progress { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--lime); box-shadow: 0 0 14px var(--lime); }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="view">
    <div id="world">
      <div id="screen"><div class="bar"><i></i><i></i><i></i><span class="url" id="url"></span></div></div>
      <canvas id="foot" width="2560" height="1920"></canvas>
      <svg id="wsvg" viewBox="0 0 1280 960"></svg>
    </div>
  </div>
  <svg id="diag" viewBox="0 0 1080 1350"></svg>
  <div id="code"></div>
  <div id="cmp"></div>
  <div id="caps"><div id="scrim"></div><div id="capbox"></div></div>
  <div id="end"></div>
  <div id="fx"><div id="grain"></div><div id="vig"></div><div id="flash"></div><div id="progress"></div></div>
</div>
<script>
// Composição dirigida por tempo: window.seek(t) desenha o frame exato do instante t (s). Sem animação CSS, sem relógio.
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: (x) => x,
  out: (x) => 1 - Math.pow(1 - x, 3),
  in: (x) => x * x * x,
  io: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  expo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  ioExpo: (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2),
  back: (x) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
};
// Visibilidade de um intervalo com fade de entrada e de saída.
const win = (t, a, b, fi = 0.25, fo = 0.25) => Math.min(E.out(prog(t, a, a + fi)), 1 - E.in(prog(t, b - fo, b)));
const interp = (pairs, x) => {
  if (x <= pairs[0][0]) return pairs[0][1];
  for (let i = 1; i < pairs.length; i++) if (x <= pairs[i][0]) return lerp(pairs[i - 1][1], pairs[i][1], (x - pairs[i - 1][0]) / (pairs[i][0] - pairs[i - 1][0]));
  return pairs.at(-1)[1];
};
// Keyframes de objetos: [[t, {..props}, ease?]]; o ease vale para o trecho que termina naquele key.
function track(keys, t) {
  if (t <= keys[0][0]) return { ...keys[0][1] };
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, ease = "io"] = keys[i];
    const [t0, v0] = keys[i - 1];
    if (t <= t1) {
      const u = E[ease]((t - t0) / (t1 - t0));
      const out = { ...v0 };
      for (const k in v1) out[k] = lerp(v0[k] ?? v1[k], v1[k], u);
      return out;
    }
  }
  return { ...keys.at(-1)[1] };
}
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

let D; // story.mjs, injetado pelo render
const cache = new Map();
const ctx = $("foot").getContext("2d");
let drawn = null;

// ---------- câmera (coordenadas do viewport gravado, 1280x960) ----------
const BASE = { rx: 0, ry: 0, rz: 0, o: 1, blur: 0 };
const CAM = [
  [0.0, { x: 640, y: 470, s: 0.34, ay: 760, rx: 34, ry: -26, rz: 5, o: 0, blur: 10 }],
  [1.0, { x: 640, y: 560, s: 0.84, ay: 830, rx: 7, ry: -5, rz: 0, o: 1, blur: 0 }, "expo"],
  [1.22, { x: 470, y: 580, s: 0.9, ay: 830, rx: 0, ry: 0 }],
  [1.55, { x: 620, y: 430, s: 0.94, ay: 800 }],
  [1.95, { x: 640, y: 440, s: 0.96, ay: 800 }],
  [2.2, { x: 1100, y: 868, s: 2.7, ay: 860 }, "ioExpo"],
  [2.95, { x: 1094, y: 868, s: 2.95, ay: 860 }, "lin"],
  [3.2, { x: 330, y: 300, s: 1.35, ay: 520 }, "ioExpo"],
  [3.45, { x: 260, y: 260, s: 1.45, ay: 520 }],
  [3.8, { x: 640, y: 670, s: 0.95, ay: 480 }, "ioExpo"],
  [5.15, { x: 640, y: 664, s: 0.98, ay: 480 }, "lin"],
  [5.5, { x: 1010, y: 735, s: 1.72, ay: 790 }, "ioExpo"],
  [5.999, { x: 1010, y: 735, s: 1.84, ay: 790 }, "lin"],
  [6.0, { x: 640, y: 480, s: 0.54, ay: 590, rx: 12, ry: 10 }, "lin"],
  [6.55, { x: 640, y: 480, s: 0.66, ay: 590, rx: 0, ry: 0 }, "expo"],
  [7.05, { x: 640, y: 480, s: 0.68, ay: 590 }, "lin"],
  [7.3, { x: 330, y: 300, s: 1.35, ay: 520 }, "ioExpo"],
  [7.4, { x: 300, y: 285, s: 1.4, ay: 520 }],
  [7.75, { x: 640, y: 670, s: 0.95, ay: 480 }, "ioExpo"],
  [9.9, { x: 640, y: 664, s: 0.98, ay: 480 }, "lin"],
  [10.25, { x: 1100, y: 845, s: 2.5, ay: 700 }, "ioExpo"],
  [11.0, { x: 1100, y: 845, s: 2.65, ay: 700 }, "lin"],
  [11.45, { x: 640, y: 560, s: 0.7, ay: 650, rx: 3, ry: -4 }, "ioExpo"],
  [12.75, { x: 640, y: 560, s: 0.73, ay: 645, rx: 5, ry: -7 }, "lin"],
  [13.4, { x: 640, y: 520, s: 0.5, ay: 300, rx: 22, ry: -14, rz: 2, o: 0.22, blur: 8 }, "io"],
  [15.0, { x: 640, y: 520, s: 0.44, ay: 280, rx: 26, ry: -18, rz: 3, o: 0.18, blur: 10 }, "lin"],
];
const cam = (t) => ({ ...BASE, ...track(CAM, t) });

// ---------- legendas cinéticas ----------
const CAPS = [
  { a: 0.12, b: 2.38, kick: "Synko Lab · 005", lines: [["Dois microfrontends."], ["Uma sessão.", "lime"]] },
  { a: 2.42, b: 3.3, kick: "access token · TTL 5 s", lines: [["O token"], ["vence.", "red"]] },
  { a: 3.32, b: 4.62, kick: "usuário clica em “Voltar”", lines: [["Os dois MFEs fazem"], ["refresh ao mesmo tempo."]] },
  { a: 4.66, b: 5.42, kick: "baseline · refresh em cada MFE", lines: [["Mesmo refresh token."], ["O segundo: 401.", "red"]] },
  { a: 5.44, b: 6.0, kick: "baseline · refresh em cada MFE", lines: [["O carrinho falha."], ["Sessão perdida.", "red"]], cut: true },
  { a: 6.06, b: 7.32, kick: "a correção · patch no shell", lines: [["Um interceptor."], ["Acima de todo MFE.", "lime"]] },
  { a: 7.36, b: 9.12, kick: "mesmo clique · mesmo token vencido", lines: [["As requests esperam."], ["Um refresh.", "lime"]] },
  { a: 9.16, b: 10.1, kick: "interceptor de window.fetch", lines: [["Repetidas com"], ["o token novo.", "lime"]] },
  { a: 10.12, b: 11.12, kick: "inspector · esta execução", lines: [["1 refresh."], ["0 falhas.", "lime"]] },
  { a: 11.16, b: 12.8, kick: "mesmo resultado em 15/15 execuções", lines: [["Os dois microfrontends"], ["seguem logados.", "lime"]] },
];
function captions(t) {
  let html = "";
  for (const c of CAPS) {
    if (t < c.a - 0.01 || t > c.b + 0.01) continue;
    const out = c.cut ? 0 : E.in(prog(t, c.b - 0.2, c.b));
    let i = 0;
    const word = (w, cls) => {
      const u = E.out(prog(t, c.a + i++ * 0.045, c.a + i * 0.045 + 0.32));
      const o = Math.min(u, 1 - out);
      return `<span class="w ${cls ?? ""}" style="opacity:${o};transform:translateY(${(1 - u) * 46 - out * 30}px);filter:blur(${(1 - u) * 10 + out * 8}px)">${esc(w)}</span>`;
    };
    const k = win(t, c.a, c.b, 0.2, c.cut ? 0.01 : 0.2);
    html += `<div class="cap" style="top:64px"><div class="kick" style="opacity:${k};letter-spacing:${0.3 - 0.16 * E.out(prog(t, c.a, c.a + 0.5))}em">${esc(c.kick)}</div>`;
    for (const [text, cls] of c.lines) html += `<div class="line">${text.split(" ").map((w) => word(w, cls)).join("")}</div>`;
    html += `</div>`;
  }
  $("capbox").innerHTML = html;
  $("scrim").style.opacity = t > 12.85 ? 1 - prog(t, 12.85, 13.1) : 1;
}

// ---------- overlays presos à tela gravada (desenhados em coordenadas do viewport) ----------
const rectOf = (take, snap, key) => D.takes[take].snapshots[snap][key];
function brackets(r, s, color, u, label, pad = 8) {
  if (!r || u <= 0) return "";
  const x = r.x - pad, y = r.y - pad, w = r.width + pad * 2, h = Math.min(r.height, 960 - r.y - 4) + pad * 2;
  const L = Math.min(34, w / 3, h / 3) / Math.max(0.6, s) * (0.4 + 0.6 * u), sw = 3 / s;
  const c = [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]]
    .map(([px, py, dx, dy]) => `<path d="M${px} ${py + dy * L}V${py}H${px + dx * L}" />`).join("");
  let out = `<g stroke="${color}" stroke-width="${sw}" fill="none" opacity="${u}" stroke-linecap="round">${c}</g>`;
  out += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${6 / s}" fill="${color}" opacity="${0.07 * u}" />`;
  if (label) {
    const fs = 17 / s, ph = 30 / s, pw = (label.length * 10.4 + 22) / s;
    out += `<g opacity="${u}" transform="translate(${x} ${y - ph - 6 / s})"><rect width="${pw}" height="${ph}" rx="${ph / 2}" fill="${color}" />` +
      `<text x="${11 / s}" y="${ph * 0.68}" font-family="JetBrains Mono, monospace" font-weight="700" font-size="${fs}" fill="#0a0b0d">${esc(label)}</text></g>`;
  }
  return out;
}
function spotlight(r, s, u, pad = 10) {
  if (!r || u <= 0) return "";
  const x = r.x - pad, y = r.y - pad, w = r.width + pad * 2, h = r.height + pad * 2;
  return `<path fill-rule="evenodd" fill="#07080a" opacity="${0.62 * u}" d="M-400 -400H1680V1400H-400Z M${x} ${y + 8}a8 8 0 0 1 8 -8h${w - 16}a8 8 0 0 1 8 8v${h - 16}a8 8 0 0 1 -8 8h${-(w - 16)}a8 8 0 0 1 -8 -8z" />`;
}
function ring(r, s, color, u, pulse = 0) {
  if (!r || u <= 0) return "";
  const g = 6 + pulse * 10;
  return `<rect x="${r.x - g}" y="${r.y - g}" width="${r.width + 2 * g}" height="${r.height + 2 * g}" rx="${10}" fill="none" stroke="${color}" stroke-width="${2.6 / s}" opacity="${u * (1 - pulse * 0.8)}" />`;
}
function cursor(t, s) {
  const cl = D.clicks;
  const shows = [[0.95, 2.78], [3.0, 3.75], [6.95, 7.72]];
  const vis = Math.max(...shows.map(([a, b]) => win(t, a, b, 0.15, 0.2)));
  if (vis <= 0) return "";
  // Desliza de um clique ao seguinte e chega 0,22 s antes de clicar, como a mão faz.
  const seq = cl.filter((c) => (t < 6 ? c.take === "baseline" : c.take === "patch"));
  let pos = seq[0].at, press = 0;
  for (let i = 0; i < seq.length; i++) {
    const c = seq[i], prev = seq[i - 1];
    const from = prev ? prev.at : { x: c.at.x + 160, y: c.at.y + 140 };
    const t0 = prev ? prev.t + 0.08 : c.t - 0.6;
    if (t >= t0) pos = { x: lerp(from.x, c.at.x, E.io(prog(t, t0, c.t - 0.22))), y: lerp(from.y, c.at.y, E.io(prog(t, t0, c.t - 0.22))) };
    press = Math.max(press, 1 - Math.abs(t - c.t) / 0.09);
  }
  let rip = "";
  for (const c of seq) {
    const u = prog(t, c.t, c.t + 0.5);
    if (u > 0 && u < 1) rip += `<circle cx="${c.at.x}" cy="${c.at.y}" r="${(10 + 46 * E.out(u)) / s}" fill="none" stroke="#c8ff3d" stroke-width="${3 / s}" opacity="${(1 - u) * vis}" />`;
  }
  const k = (1 - 0.18 * clamp(press)) / s;
  return rip + `<g transform="translate(${pos.x} ${pos.y}) scale(${k * 1.25})" opacity="${vis}">` +
    `<path d="M0 0 L0 24 L6 18.5 L10.5 28 L14.5 26.2 L10 17 L17.5 17 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" /></g>`;
}
function worldOverlays(t, c) {
  const s = c.s;
  let g = "";
  // Ato 1: os dois MFEs e o shell.
  if (t < 1.3) {
    const u = (d) => E.out(prog(t, 0.45 + d, 0.95 + d)) * (1 - prog(t, 1.12, 1.28));
    g += brackets(rectOf("baseline", "home", "catalog"), s, "#c8ff3d", u(0), "MFE · catalog");
    g += brackets(rectOf("baseline", "home", "cart"), s, "#c8ff3d", u(0.12), "MFE · cart");
    g += brackets({ x: 6, y: 6, width: 1268, height: 948 }, s, "#ffffff", u(0.24) * 0.9, "shell · single-spa", 0);
  }
  // Ato 1: o token vence no Inspector.
  if (t > 2.05 && t < 3.15) {
    const v = win(t, 2.1, 3.12, 0.2, 0.15);
    g += spotlight(rectOf("baseline", "expired", "dock"), s, v, 8);
    g += ring(rectOf("baseline", "expired", "session"), s, t > 2.56 ? "#ff5a47" : "#c8ff3d", v);
    const p = prog(t, 2.56, 3.0);
    if (p > 0) g += ring(rectOf("baseline", "expired", "session"), s, "#ff5a47", v, p);
  }
  // Ato 2: o desfecho do baseline.
  if (t > 5.2 && t < 6.0) {
    const v = E.out(prog(t, 5.25, 5.55));
    const r = rectOf("baseline", "after", "cartAlert"), d = rectOf("baseline", "after", "dock");
    g += spotlight({ x: r.x, y: r.y, width: d.x + d.width - r.x, height: d.y + d.height - r.y }, s, v, 6);
    g += brackets(r, s, "#ff5a47", v, "cart · refresh falhou");
    g += ring(rectOf("baseline", "after", "session"), s, "#ff5a47", v);
    g += ring(rectOf("baseline", "after", "refresh"), s, "#ff5a47", v);
    g += ring(rectOf("baseline", "after", "failures"), s, "#ff5a47", v);
  }
  // Ato 3: o patch envolve a página inteira; a estratégia aparece no Inspector.
  if (t > 6.0 && t < 7.4) {
    const u = E.ioExpo(prog(t, 6.08, 6.7)), v = 1 - prog(t, 7.1, 7.3);
    const per = 2 * (1268 + 990);
    g += `<rect x="6" y="-34" width="1268" height="990" rx="14" fill="none" stroke="#c8ff3d" stroke-width="${5 / s}" stroke-dasharray="${per * u} ${per}" opacity="${v}" filter="url(#glow)" />`;
    const lab = "shell · window.fetch trocado antes de os MFEs montarem";
    const fs = 17 / s, ph = 32 / s, pw = (lab.length * 10.4 + 24) / s;
    g += `<g opacity="${E.out(prog(t, 6.45, 6.75)) * v}" transform="translate(6 ${956 + 10 / s})"><rect width="${pw}" height="${ph}" rx="${ph / 2}" fill="#c8ff3d" /><text x="${12 / s}" y="${ph * 0.68}" font-family="JetBrains Mono, monospace" font-weight="700" font-size="${fs}" fill="#0a0b0d">${esc(lab)}</text></g>`;
    g += brackets(rectOf("patch", "expired", "strategy"), s, "#c8ff3d", E.out(prog(t, 6.6, 6.9)) * v, "estratégia: Patch no shell", 6);
  }
  // Ato 3: Inspector depois do patch.
  if (t > 10.05 && t < 11.3) {
    const v = win(t, 10.1, 11.25, 0.2, 0.2);
    g += spotlight(rectOf("patch", "after", "dock"), s, v, 8);
    for (const k of ["session", "refresh", "failures"]) g += ring(rectOf("patch", "after", k), s, "#c8ff3d", v);
    const p = prog(t, 10.25, 10.85);
    if (p > 0 && p < 1) g += ring(rectOf("patch", "after", "refresh"), s, "#c8ff3d", v, p);
  }
  // Ato 4: os dois MFEs de volta.
  if (t > 11.3 && t < 13.2) {
    const u = (d) => E.out(prog(t, 11.45 + d, 11.9 + d)) * (1 - prog(t, 12.8, 13.05));
    g += brackets(rectOf("patch", "after", "catalog"), s, "#c8ff3d", u(0), `catalog · ${D.takes.patch.snapshots.after.text.catalogStatus}`);
    g += brackets(rectOf("patch", "after", "cart"), s, "#c8ff3d", u(0.12), `cart · ${D.takes.patch.snapshots.after.text.cartStatus}`);
  }
  g += cursor(t, s);
  $("wsvg").innerHTML = `<defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${6 / s}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>` + g;
}

// ---------- diagrama de rede (coordenadas do palco) ----------
const curve = (a, b, bend = 0) => {
  const dx = (b[0] - a[0]) * 0.5;
  return [a, [a[0] + dx, a[1] + bend], [b[0] - dx, b[1] + bend], b];
};
const at = (c, u) => {
  const m = 1 - u;
  return [0, 1].map((k) => m * m * m * c[0][k] + 3 * m * m * u * c[1][k] + 3 * m * u * u * c[2][k] + u * u * u * c[3][k]);
};
const dOf = (c) => `M${c[0]} C${c[1]} ${c[2]} ${c[3]}`;
const rev = (c) => [c[3], c[2], c[1], c[0]];
function packet(c, u, label, color, side = -1) {
  if (u <= 0 || u >= 1) return "";
  const pts = [];
  for (let k = 0; k <= 16; k++) pts.push(at(c, Math.max(0, u - 0.32 + (0.32 * k) / 16)));
  const [x, y] = at(c, u);
  const tw = label.length * 11.2 + 26;
  return `<polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" opacity=".55" />` +
    `<circle cx="${x}" cy="${y}" r="16" fill="${color}" opacity=".22" /><circle cx="${x}" cy="${y}" r="8" fill="${color}" filter="url(#dglow)" />` +
    `<g transform="translate(${x - tw / 2} ${y + side * 30 - 17})"><rect width="${tw}" height="34" rx="17" fill="#0b0c0f" stroke="${color}" stroke-width="2" />` +
    `<text x="${tw / 2}" y="23" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="18" fill="${color}">${esc(label)}</text></g>`;
}
function node(cx, cy, w, h, title, sub, state, extra = "") {
  const col = { idle: "#3a3f47", lime: "#c8ff3d", red: "#ff5a47" }[state] ?? "#3a3f47";
  const fill = { lime: "#c8ff3d14", red: "#ff5a471c" }[state] ?? "#111317";
  return `<g transform="translate(${cx - w / 2} ${cy - h / 2})">${extra}<rect width="${w}" height="${h}" rx="18" fill="${fill}" stroke="${col}" stroke-width="2.4" ${state !== "idle" ? 'filter="url(#dglow)"' : ""} />` +
    `<rect width="${w}" height="${h}" rx="18" fill="#0e1013" opacity=".72" />` +
    `<text x="22" y="${h / 2 - 6}" font-family="-apple-system, system-ui" font-weight="720" font-size="27" fill="#f2f3ee">${esc(title)}</text>` +
    `<text x="22" y="${h / 2 + 24}" font-family="JetBrains Mono, monospace" font-weight="500" font-size="16" fill="${state === "idle" ? "#8b9098" : col}">${esc(sub)}</text></g>`;
}
const fmtMs = (ms) => `T+${String(Math.round(ms)).padStart(3, "0")} ms`;

function diagram(t) {
  let g = `<defs><filter id="dglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  const act2 = win(t, 3.42, 5.42, 0.3, 0.28), act3 = win(t, 7.3, 10.2, 0.25, 0.3);
  const v = Math.max(act2, act3);
  if (v <= 0) return void ($("diag").innerHTML = g);
  const take = act2 > 0 ? "baseline" : "patch";
  const W = D.slow[take], net = D.takes[take].net;
  const msAt = (tt) => ((tt - W.from) / (W.to - W.from)) * D.slowMs;
  const ms = clamp(msAt(t), 0, D.slowMs);
  const vt = (m) => W.from + (m / D.slowMs) * (W.to - W.from);
  const ph = (a, b) => prog(t, vt(a), vt(b)); // fase entre dois instantes reais (ms)
  const refresh = net.filter((r) => r.op === "refreshToken");
  const Y0 = 815, CY = 1060, CA = [220, 935], CB = [220, 1185];

  g += `<g opacity="${v}">`;
  g += `<text x="64" y="${Y0}" font-family="JetBrains Mono, monospace" font-weight="600" font-size="17" letter-spacing="2.5" fill="#8b9098">REDE · POST /graphql · TEMPOS REAIS</text>`;
  g += `<g transform="translate(1016 ${Y0})"><text text-anchor="end" font-family="JetBrains Mono, monospace" font-weight="700" font-size="30" fill="#f2f3ee" y="2">${fmtMs(ms)}</text>` +
    `<text text-anchor="end" y="30" font-family="JetBrains Mono, monospace" font-weight="600" font-size="15" letter-spacing="2" fill="#c8ff3d">CÂMERA LENTA ×${W.factor}</text></g>`;

  // Contadores: a contagem vem da rede gravada, incrementa quando cada chamada sai/volta.
  const sent = refresh.filter((r) => ms >= r.start).length;
  const rejected = refresh.filter((r) => r.status >= 400 && ms >= r.end).length;

  if (take === "baseline") {
    const API = [860, CY];
    const cA = curve([CA[0] + 145, CA[1]], [API[0] - 150, API[1] - 22], 0), cB = curve([CB[0] + 145, CB[1]], [API[0] - 150, API[1] + 22], 0);
    g += `<path d="${dOf(cA)}" stroke="#2c3037" stroke-width="2.5" fill="none" stroke-dasharray="6 8" /><path d="${dOf(cB)}" stroke="#2c3037" stroke-width="2.5" fill="none" stroke-dasharray="6 8" />`;
    const ok = refresh.find((r) => r.status < 400), bad = refresh.find((r) => r.status >= 400);
    const prod = net.find((r) => r.op === "products");
    const cartDead = ms >= bad.end, catOk = ms >= prod.end;
    const busy = ms >= 34 && ms < bad.end - 8;
    const apiState = busy ? "lime" : ms >= bad.end - 8 && ms < bad.end + 30 ? "red" : "idle";
    const apiSub = ms < 34 ? "refresh rotativo · 150 ms" : busy ? "2× o mesmo refresh token" : ms < prod.end ? "1º ok · 2º REFRESH_REUSED" : "REFRESH_REUSED";
    const shake = cartDead ? Math.sin(t * 90) * 7 * (1 - prog(t, vt(bad.end), vt(bad.end) + 0.3)) : 0;
    g += node(CA[0], CA[1], 290, 104, "Vitrine", catOk ? "catalog · products 200" : ms > ok.end ? "catalog · token novo" : "catalog · refresh próprio", catOk ? "lime" : "idle");
    g += node(CB[0] + shake, CB[1], 290, 104, "Carrinho", cartDead ? "cart · sessão apagada" : "cart · refresh próprio", cartDead ? "red" : "idle");
    g += node(API[0], API[1], 300, 128, "API", apiSub, apiState);
    // Requisições de refresh: saem juntas, o servidor segura 150 ms, voltam com desfechos opostos.
    g += packet(cA, ph(ok.start, 34), "refreshToken", "#e9ecef", -1);
    g += packet(cB, ph(bad.start, 34), "refreshToken", "#e9ecef", 1);
    g += packet(rev(cA), ph(ok.end - 24, ok.end), "200", "#c8ff3d", -1);
    g += packet(rev(cB), ph(bad.end - 24, bad.end), `401 ${bad.code}`, "#ff5a47", 1);
    g += packet(cA, ph(prod.start, prod.start + 16), "products", "#e9ecef", -1);
    g += packet(rev(cA), ph(prod.end - 18, prod.end), "200", "#c8ff3d", -1);
    if (busy) {
      const k = 10 + 6 * Math.sin(t * 16);
      g += `<rect x="${API[0] - 150 - k}" y="${API[1] - 64 - k}" width="${300 + 2 * k}" height="${128 + 2 * k}" rx="${18 + k}" fill="none" stroke="#c8ff3d" stroke-width="2" opacity=".4" />`;
      for (const dy of [-22, 22]) g += `<circle cx="${API[0] - 150}" cy="${API[1] + dy}" r="8" fill="#e9ecef" filter="url(#dglow)" />`;
    }
    if (ms >= bad.end - 8) {
      const u = prog(t, vt(bad.end - 8), vt(bad.end - 8) + 0.5);
      g += `<circle cx="${API[0]}" cy="${API[1]}" r="${70 + 160 * E.out(u)}" fill="none" stroke="#ff5a47" stroke-width="${6 * (1 - u)}" opacity="${1 - u}" />`;
    }
    g += counters(sent, rejected, 2, "#ff5a47");
  } else {
    const G = [540, CY], API = [930, CY];
    const cA = curve([CA[0] + 125, CA[1]], [G[0] - 135, G[1] - 24]), cB = curve([CB[0] + 125, CB[1]], [G[0] - 135, G[1] + 24]);
    const cR = curve([G[0] + 135, G[1]], [API[0] - 105, API[1]]);
    const cA2 = curve([G[0] + 135, G[1] - 24], [API[0] - 105, API[1] - 24]), cB2 = curve([G[0] + 135, G[1] + 24], [API[0] - 105, API[1] + 24]);
    for (const c of [cA, cB, cR]) g += `<path d="${dOf(c)}" stroke="#2c3037" stroke-width="2.5" fill="none" stroke-dasharray="6 8" />`;
    const r = refresh[0], prod = net.find((x) => x.op === "products"), cart = net.find((x) => x.op === "cart");
    const holding = ms >= 14 && ms < prod.start, fresh = ms >= r.end;
    // O nó central é o próprio interceptor: segura as duas requests enquanto o único refresh está em voo.
    const pulse = holding ? (Math.sin(t * 9) + 1) / 2 : 0;
    const halo = `<rect x="-14" y="-14" width="${300}" height="${168}" rx="26" fill="none" stroke="#c8ff3d" stroke-width="2" opacity="${0.15 + 0.35 * pulse}" />`;
    g += node(CA[0] - 40, CA[1], 250, 104, "Vitrine", ms >= prod.end ? "catalog · products 200" : "catalog · plain HttpLink", ms >= prod.end ? "lime" : "idle");
    g += node(CB[0] - 40, CB[1], 250, 104, "Carrinho", ms >= cart.end ? "cart · cart 200" : "cart · plain HttpLink", ms >= cart.end ? "lime" : "idle");
    g += node(G[0], G[1], 272, 140, "window.fetch", holding ? (fresh ? "token novo · repetindo" : "2 esperando · 1 refresh") : ms < 14 ? "interceptor no shell" : "interceptor · pronto", "lime", halo);
    g += node(API[0] + 10, API[1], 210, 128, "API", ms >= r.start && ms < r.end ? "refresh · 150 ms" : "/graphql", ms >= r.start && ms < r.end ? "lime" : "idle");
    // As duas requests chegam ao interceptor e esperam; o refresh sai uma vez e volta 200.
    g += packet(curve([CA[0] + 85, CA[1]], [G[0] - 135, G[1] - 24]), ph(0, 14), "products", "#e9ecef", -1);
    g += packet(curve([CB[0] + 85, CB[1]], [G[0] - 135, G[1] + 24]), ph(0, 14), "cart", "#e9ecef", 1);
    if (holding) {
      const q = (k) => {
        const a = t * 5.2 + k * Math.PI;
        return [G[0] + Math.cos(a) * 172, G[1] + Math.sin(a) * 100];
      };
      for (const [k, lab] of [[0, "products"], [1, "cart"]]) {
        const [x, y] = q(k);
        g += `<circle cx="${x}" cy="${y}" r="8" fill="#e9ecef" filter="url(#dglow)" /><text x="${x}" y="${y - 16}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="16" fill="#e9ecef">${lab}</text>`;
      }
    }
    g += packet(cR, ph(r.start, 34), "refreshToken ×1", "#c8ff3d", -1);
    g += packet(rev(cR), ph(r.end - 22, r.end), "200 · token novo", "#c8ff3d", 1);
    if (fresh) {
      const u = prog(t, vt(r.end), vt(r.end) + 0.6);
      g += `<circle cx="${G[0]}" cy="${G[1]}" r="${90 + 200 * E.out(u)}" fill="none" stroke="#c8ff3d" stroke-width="${8 * (1 - u)}" opacity="${1 - u}" />`;
    }
    g += packet(cA2, ph(prod.start, prod.start + 14), "products · Bearer novo", "#c8ff3d", -1);
    g += packet(cB2, ph(cart.start, cart.start + 14), "cart · Bearer novo", "#c8ff3d", 1);
    g += packet(rev(cA2), ph(prod.end - 30, prod.end - 14), "200", "#c8ff3d", -1);
    g += packet(rev(cB2), ph(cart.end - 30, cart.end - 14), "200", "#c8ff3d", 1);
    g += packet(rev(cA), ph(prod.end - 14, prod.end), "200", "#c8ff3d", -1);
    g += packet(rev(cB), ph(cart.end - 14, cart.end), "200", "#c8ff3d", 1);
    g += counters(sent, rejected, 1, "#c8ff3d");
  }
  g += `</g>`;
  $("diag").innerHTML = g;
}
function counters(sent, rejected, max, col) {
  const y = 1300;
  return `<text x="64" y="${y}" font-family="JetBrains Mono, monospace" font-weight="600" font-size="18" letter-spacing="1.5" fill="#8b9098">CHAMADAS DE REFRESH</text>` +
    `<text x="318" y="${y + 6}" font-family="-apple-system, system-ui" font-weight="800" font-size="44" fill="${sent >= max ? col : "#f2f3ee"}">${sent}</text>` +
    `<text x="420" y="${y}" font-family="JetBrains Mono, monospace" font-weight="600" font-size="18" letter-spacing="1.5" fill="#8b9098">REJEITADAS</text>` +
    `<text x="570" y="${y + 6}" font-family="-apple-system, system-ui" font-weight="800" font-size="44" fill="${rejected ? "#ff5a47" : "#f2f3ee"}">${rejected}</text>`;
}

// ---------- cartão de código (o patch real, de apps/shell/src/root-config.ts) ----------
const CODE = [
  `<span class="k">if</span> (lab.load === <span class="p">"root"</span>) installPatch() <span class="c">// antes dos MFEs</span>`,
  ``,
  `window.<span class="f">fetch</span> = <span class="f">createAuthFetch</span>({`,
  `  bffUrl: lab.bffUrl,`,
  `  baseFetch: window.fetch.bind(window),`,
  `  onExpired: lab.onExpired,`,
  `})`,
];
function code(t) {
  const v = win(t, 6.18, 7.42, 0.3, 0.01);
  const el = $("code");
  if (v <= 0) return void (el.style.opacity = 0);
  const m = E.ioExpo(prog(t, 7.1, 7.42)); // encolhe na direção do nó window.fetch do diagrama
  el.style.opacity = v * (1 - m) * (1 - m);
  el.style.top = "965px";
  el.style.transform = `translateY(${(1 - E.out(prog(t, 6.18, 6.6))) * 60 + m * 70}px) scale(${1 - m * 0.68})`;
  el.style.filter = `blur(${(1 - E.out(prog(t, 6.18, 6.5))) * 10}px)`;
  const shown = Math.floor(lerp(0, CODE.length + 0.99, prog(t, 6.3, 6.95)));
  el.innerHTML = `<div class="file">apps/shell/src/root-config.ts</div>` +
    CODE.map((l, i) => `<div style="opacity:${i < shown ? 1 : 0.0};min-height:1.6em">${l}</div>`).join("");
}

// ---------- comparação final (esta gravação + 15 execuções do benchmark) ----------
function compare(t) {
  const v = win(t, 11.55, 12.88, 0.35, 0.2);
  const el = $("cmp");
  el.style.top = "975px";
  if (v <= 0) return void (el.style.opacity = 0);
  const b = D.takes.baseline.counts, p = D.takes.patch.counts, n = D.evidence.n;
  const card = (cls, h, num, unit, out, d) => {
    const u = E.out(prog(t, 11.55 + d, 11.95 + d));
    return `<div class="card ${cls}" style="opacity:${u};transform:translateY(${(1 - u) * 40}px)"><h4>${h}</h4><div class="n">${num}</div><div class="u">${unit}</div><div class="o">${out}</div><div class="r">igual em ${n}/${n} execuções</div></div>`;
  };
  el.style.opacity = v;
  el.innerHTML =
    card("bad", "refresh em cada MFE", b.Refresh, "chamadas de refresh", `${b.Falhas} rejeitada · sessão perdida`, 0) +
    card("good", "interceptor no shell", p.Refresh, "chamada de refresh", `${p.Falhas} rejeitadas · sessão mantida`, 0.12);
}

// ---------- cartela final ----------
function endCard(t) {
  const el = $("end");
  if (t < 12.85) return void (el.style.opacity = 0);
  el.style.opacity = 1;
  const word = (text, a, cls) =>
    [...text].map((ch, i) => {
      const u = E.out(prog(t, a + i * 0.022, a + i * 0.022 + 0.42));
      return `<span class="ch ${cls}" style="opacity:${u};transform:translateY(${(1 - u) * 70}px) rotate(${(1 - u) * 6}deg);filter:blur(${(1 - u) * 12}px)">${ch === " " ? "&nbsp;" : esc(ch)}</span>`;
    }).join("");
  const line = E.ioExpo(prog(t, 13.75, 14.25));
  el.innerHTML =
    `<div class="big">${word("UM", 12.95)}</div><div class="big">${word("REFRESH.", 13.1)}</div>` +
    `<div class="sub">${word("VÁRIOS", 13.55, "")}<br>${word("MICROFRONTENDS.", 13.7, "")}</div>` +
    `<div style="height:4px;margin-top:38px;width:${line * 100}%;background:#c8ff3d;box-shadow:0 0 18px #c8ff3d"></div>` +
    `<div class="meta" style="opacity:${E.out(prog(t, 14.0, 14.4))}">shell single-spa · Apollo em cada MFE · refresh token rotativo<br>um interceptor de window.fetch · Synko Lab #005</div>`;
}

// ---------- footage ----------
function sourceAt(t) {
  const take = t < 6 ? "baseline" : "patch";
  const ms = interp(D.srcMap[take], t);
  const fr = D.takes[take].frames;
  let f = fr[0];
  for (const x of fr) if (x.t <= ms) f = x; else break;
  return { take, file: `footage/${take}/${f.file}` };
}
async function image(src) {
  if (!cache.has(src)) {
    const img = new Image();
    img.src = src;
    cache.set(src, img.decode().then(() => img));
    if (cache.size > 24) cache.delete(cache.keys().next().value);
  }
  return cache.get(src);
}

window.setup = (data) => {
  D = data;
  // Grão de filme: um ruído fixo, deslocado a cada frame.
  const n = document.createElement("canvas");
  n.width = n.height = 256;
  const c = n.getContext("2d"), id = c.createImageData(256, 256);
  let s = 7;
  for (let i = 0; i < id.data.length; i += 4) {
    s = (s * 16807) % 2147483647;
    const v = s % 255;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
    id.data[i + 3] = 255;
  }
  c.putImageData(id, 0, 0);
  $("grain").style.backgroundImage = `url(${n.toDataURL()})`;
};

window.seek = async (t) => {
  const src = sourceAt(t);
  if (drawn !== src.file) {
    ctx.drawImage(await image(src.file), 0, 0, 2560, 1920);
    drawn = src.file;
  }
  $("url").textContent = D.takes[src.take].url;

  const c = cam(t), p = cam(Math.max(0, t - 1 / 60));
  // Desfoque de movimento proporcional à velocidade da câmera no palco.
  const vel = Math.hypot((c.x - p.x) * c.s, (c.y - p.y) * c.s) + Math.abs(c.s - p.s) * 900 + Math.abs(c.ay - p.ay);
  const blur = clamp(vel * 0.09, 0, 9) + c.blur;
  $("world").style.transform = `translate(540px, ${c.ay}px) perspective(1800px) rotateX(${c.rx}deg) rotateY(${c.ry}deg) rotateZ(${c.rz}deg) scale(${c.s}) translate(${-c.x}px, ${-c.y}px)`;
  $("world").style.opacity = c.o;
  $("view").style.filter = blur > 0.4 ? `blur(${blur.toFixed(2)}px)` : "none";
  // Quando o diagrama ocupa a parte de baixo, a tela gravada some num degradê acima dele.
  const dv = Math.max(win(t, 3.42, 5.4, 0.3, 0.3), win(t, 6.15, 10.2, 0.3, 0.3), win(t, 11.5, 12.9, 0.3, 0.2));
  const tgt = t > 11 ? 960 : t > 6 ? lerp(1000, 770, E.io(prog(t, 7.1, 7.5))) : 770; // no ato 3 o código fica abaixo da tela inteira
  const cut = lerp(1350, tgt, dv);
  const top = t > 0.1 && t < 12.85 ? 1 : 0; // a tela some sob as legendas
  $("view").style.maskImage = `linear-gradient(transparent ${top * 150}px, #000 ${top * 300}px, #000 ${cut - 50}px, transparent ${cut}px)`;

  worldOverlays(t, c);
  diagram(t);
  code(t);
  compare(t);
  captions(t);
  endCard(t);

  const fl = Math.max(1 - Math.abs(t - 6.0) / 0.14, 0) * 0.85;
  $("flash").style.opacity = fl;
  $("grain").style.transform = `translate(${(Math.floor(t * 30) * 37) % 64}px, ${(Math.floor(t * 30) * 53) % 64}px)`;
  $("progress").style.width = `${(t / D.duration) * 100}%`;
  $("progress").style.opacity = t > 12.85 ? 0 : 0.9;
};
</script>
