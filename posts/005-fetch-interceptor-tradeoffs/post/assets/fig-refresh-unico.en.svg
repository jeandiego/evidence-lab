dle">MFE catalog</text><text class="m dg-sub" x="96.0" y="54.0" text-anchor="middle">no refresh logic</text><rect class="dg-mask" x="200" y="16" width="144" height="48"/><rect class="dg-node" x="200" y="16" width="144" height="48"/><text class="dg-name" x="272.0" y="38.0" text-anchor="middle">MFE cart</text><text class="m dg-sub" x="272.0" y="54.0" text-anchor="middle">no refresh logic</text><rect class="dg-mask" x="376" y="16" width="144" height="48"/><rect class="dg-focal" x="376" y="16" width="144" height="48"/><text class="dg-name dg-name-f" x="448.0" y="38.0" text-anchor="middle">Auth layer</text><text class="m dg-sub dg-sub-f" x="448.0" y="54.0" text-anchor="middle">patch or authFetch</text><rect class="dg-mask" x="552" y="16" width="144" height="48"/><rect class="dg-node" x="552" y="16" width="144" height="48"/><text class="dg-name" x="624.0" y="38.0" text-anchor="middle">API</text><text class="m dg-sub" x="624.0" y="54.0" text-anchor="middle">node · graphql · jwt</text><line class="dg-rule" x1="0" y1="396" x2="720" y2="396"/><line class="dg-ln" x1="0" y1="414" x2="24" y2="414" marker-end="url(#dg2-a)"/><text class="m dg-lbl" x="34" y="417">CALL</text><line class="dg-ln-soft dg-dash" x1="130" y1="414" x2="154" y2="414" marker-end="url(#dg2-s)"/><text class="m dg-lbl" x="164" y="417">RESPONSE</text><line class="dg-ln dg-fail" x1="260" y1="414" x2="284" y2="414" marker-end="url(#dg2-f)"/><text class="m dg-lbl dg-lbl-fail" x="294" y="417">FAILURE</text></svg>
