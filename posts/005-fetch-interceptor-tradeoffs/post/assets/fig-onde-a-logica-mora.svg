<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" aria-labelledby="dg3-t dg3-d">
<title id="dg3-t">Onde a lógica de refresh mora</title>
<desc id="dg3-d">Três colunas: no baseline cada MFE tem a própria lógica de refresh e a API recebe três refreshes; no patch o shell envolve window.fetch e a API recebe um; no módulo compartilhado cada MFE importa o authFetch e a API recebe um.</desc>
<style>
.dg{--c-paper:var(--paper,#f3f0e9);--c-ink:var(--ink,#141518);--c-soft:var(--ink-soft,#2f3034);--c-muted:var(--ink-muted,#66655f);--c-rule:var(--rule,#d8d2c5);--c-surface:var(--surface,rgb(20 21 24/.04));--c-fail:var(--dg-fail,#a3311f)}
.dg text{font-family:var(--font-sans,'Instrument Sans','Helvetica Neue',Arial,sans-serif)}
.dg .m{font-family:var(--font-mono,'IBM Plex Mono',ui-monospace,monospace)}
.dg-bg{fill:var(--c-paper)}
.dg-node{fill:var(--c-paper);stroke:var(--c-ink);stroke-width:1}
.dg-focal{fill:var(--c-ink);stroke:var(--c-ink);stroke-width:1}
.dg-store{fill:var(--c-surface);stroke:var(--c-muted);stroke-width:1}
.dg-chip{fill:var(--c-paper);stroke:var(--c-ink);stroke-width:1}
.dg-chip-solid{fill:var(--c-ink)}
.dg-name{fill:var(--c-ink);font-size:13.5px;font-weight:600}
.dg-name-f{fill:var(--c-paper)}
.dg-sub{fill:var(--c-muted);font-size:10.5px}
.dg-sub-f{fill:var(--c-paper);opacity:.82}
.dg-life{stroke:var(--c-rule);stroke-width:1;stroke-dasharray:3 3}
.dg-rule{stroke:var(--c-rule);stroke-width:1}
.dg-ln{stroke:var(--c-ink);stroke-width:1.4;fill:none}
.dg-ln-strong{stroke:var(--c-ink);stroke-width:2.2;fill:none}
.dg-ln-soft{stroke:var(--c-muted);stroke-width:1.2;fill:none}
.dg-dash{stroke-dasharray:5 4}
.dg-fail{stroke:var(--c-fail)}
.dg-lbl{fill:var(--c-muted);font-size:10px;font-weight:500;letter-spacing:.06em}
.dg-lbl-fail{fill:var(--c-fail)}
.dg-mask{fill:var(--c-paper)}
.dg-eyebrow{fill:var(--c-muted);font-size:10px;font-weight:500;letter-spacing:.14em}
.dg-cap{fill:var(--c-muted);font-size:11px}
.dg-mk{fill:var(--c-ink)}.dg-mk-s{fill:var(--c-muted)}.dg-mk-f{fill:var(--c-fail)}
</style>
<defs><marker id="dg3-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-mk" points="0 0, 8 3, 0 6"/></marker><marker id="dg3-s" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-mk-s" points="0 0, 8 3, 0 6"/></marker><marker id="dg3-f" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-mk-f" points="0 0, 8 3, 0 6"/></marker></defs>
<rect class="dg-bg" width="720" height="392"/>
<text class="m dg-eyebrow" x="0" y="18">BASELINE</text><line class="dg-rule" x1="0" y1="28" x2="224" y2="28"/><rect class="dg-node" x="0" y="48" width="64" height="60"/><text class="dg-name" x="32" y="70" text-anchor="middle" style="font-size:12px">MFE A</text><rect class="dg-chip-solid" x="4" y="80" width="56" height="18"/><text class="m dg-sub dg-sub-f" x="32" y="92.5" text-anchor="middle" style="font-size:10px">refresh</text><rect class="dg-node" x="80" y="48" width="64" height="60"/><text class="dg-name" x="112" y="70" text-anchor="middle" style="font-size:12px">MFE B</text><rect class="dg-chip-solid" x="84" y="80" width="56" height="18"/><text class="m dg-sub dg-sub-f" x="112" y="92.5" text-anchor="middle" style="font-size:10px">refresh</text><rect class="dg-node" x="160" y="48" width="64" height="60"/><text class="dg-name" x="192" y="70" text-anchor="middle" style="font-size:12px">MFE C</text><rect class="dg-chip-solid" x="164" y="80" width="56" height="18"/><text class="m dg-sub dg-sub-f" x="192" y="92.5" text-anchor="middle" style="font-size:10px">refresh</text><line class="dg-ln" x1="32" y1="108" x2="32" y2="288" marker-end="url(#dg3-a)"/><line class="dg-ln" x1="112" y1="108" x2="112" y2="288" marker-end="url(#dg3-a)"/><line class="dg-ln" x1="192" y1="108" x2="192" y2="288" marker-end="url(#dg3-a)"/><rect class="dg-mask" x="0" y="288" width="224" height="48"/><rect class="dg-node" x="0" y="288" width="224" height="48"/><text class="dg-name" x="112.0" y="310.0" text-anchor="middle">API</text><text class="m dg-sub" x="112.0" y="326.0" text-anchor="middle">3 refreshes por abertura</text><line class="dg-rule" x1="0" y1="352" x2="224" y2="352"/><text class="m dg-cap" x="0" y="372">lógica duplicada em cada MFE</text><text class="m dg-eyebrow" x="248" y="18">PATCH NO SHELL</text><line class="dg-rule" x1="248" y1="28" x2="472" y2="28"/><rect class="dg-node" x="248" y="48" width="64" height="60"/><text class="dg-name" x="280" y="70" text-anchor="middle" style="font-size:12px">MFE A</text><text class="m dg-sub" x="280" y="92" text-anchor="middle" style="font-size:10px">fetch</text><rect class="dg-node" x="328" y="48" width="64" height="60"/><text class="dg-name" x="360" y="70" text-anchor="middle" style="font-size:12px">MFE B</text><text class="m dg-sub" x="360" y="92" text-anchor="middle" style="font-size:10px">fetch</text><rect class="dg-node" x="408" y="48" width="64" height="60"/><text class="dg-name" x="440" y="70" text-anchor="middle" style="font-size:12px">MFE C</text><text class="m dg-sub" x="440" y="92" text-anchor="middle" style="font-size:10px">fetch</text><line class="dg-ln-soft dg-dash" x1="280" y1="108" x2="280" y2="156" marker-end="url(#dg3-s)"/><line class="dg-ln-soft dg-dash" x1="360" y1="108" x2="360" y2="156" marker-end="url(#dg3-s)"/><line class="dg-ln-soft dg-dash" x1="440" y1="108" x2="440" y2="156" marker-end="url(#dg3-s)"/><rect class="dg-mask" x="248" y="156" width="224" height="44"/><rect class="dg-focal" x="248" y="156" width="224" height="44"/><text class="dg-name dg-name-f" x="360.0" y="176.0" text-anchor="middle">window.fetch</text><text class="m dg-sub dg-sub-f" x="360.0" y="192.0" text-anchor="middle">refresh único + replay</text><line class="dg-ln-strong" x1="360" y1="200" x2="360" y2="288" marker-end="url(#dg3-a)"/><rect class="dg-mask" x="248" y="288" width="224" height="48"/><rect class="dg-node" x="248" y="288" width="224" height="48"/><text class="dg-name" x="360.0" y="310.0" text-anchor="middle">API</text><text class="m dg-sub" x="360.0" y="326.0" text-anchor="middle">1 refresh</text><line class="dg-rule" x1="248" y1="352" x2="472" y2="352"/><text class="m dg-cap" x="248" y="372">lógica no shell, invisível aos MFEs</text><text class="m dg-eyebrow" x="496" y="18">MÓDULO COMPARTILHADO</text><line class="dg-rule" x1="496" y1="28" x2="720" y2="28"/><rect class="dg-node" x="496" y="48" width="64" height="60"/><text class="dg-name" x="528" y="70" text-anchor="middle" style="font-size:12px">MFE A</text><rect class="dg-chip" x="500" y="80" width="56" height="18"/><text class="m dg-name" x="528" y="92.5" text-anchor="middle" style="font-size:10px;font-weight:500">authFetch</text><rect class="dg-node" x="576" y="48" width="64" height="60"/><text class="dg-name" x="608" y="70" text-anchor="middle" style="font-size:12px">MFE B</text><rect class="dg-chip" x="580" y="80" width="56" height="18"/><text class="m dg-name" x="608" y="92.5" text-anchor="middle" style="font-size:10px;font-weight:500">authFetch</text><rect class="dg-node" x="656" y="48" width="64" height="60"/><text class="dg-name" x="688" y="70" text-anchor="middle" style="font-size:12px">MFE C</text><rect class="dg-chip" x="660" y="80" width="56" height="18"/><text class="m dg-name" x="688" y="92.5" text-anchor="middle" style="font-size:10px;font-weight:500">authFetch</text><line class="dg-ln" x1="528" y1="108" x2="528" y2="156" marker-end="url(#dg3-a)"/><line class="dg-ln" x1="608" y1="108" x2="608" y2="156" marker-end="url(#dg3-a)"/><line class="dg-ln" x1="688" y1="108" x2="688" y2="156" marker-end="url(#dg3-a)"/><rect class="dg-mask" x="496" y="156" width="224" height="44"/><rect class="dg-focal" x="496" y="156" width="224" height="44"/><text class="dg-name dg-name-f" x="608.0" y="176.0" text-anchor="middle">authFetch</text><text class="m dg-sub dg-sub-f" x="608.0" y="192.0" text-anchor="middle">módulo no import map</text><line class="dg-ln-strong" x1="608" y1="200" x2="608" y2="288" marker-end="url(#dg3-a)"/><rect class="dg-mask" x="496" y="288" width="224" height="48"/><rect class="dg-node" x="496" y="288" width="224" height="48"/><text class="dg-name" x="608.0" y="310.0" text-anchor="middle">API</text><text class="m dg-sub" x="608.0" y="326.0" text-anchor="middle">1 refresh</text><line class="dg-rule" x1="496" y1="352" x2="720" y2="352"/><text class="m dg-cap" x="496" y="372">módulo importado por cada MFE</text></svg>
